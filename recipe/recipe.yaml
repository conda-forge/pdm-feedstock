schema_version: 1

context:
  name: pdm
  version: 2.29.5

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pdm-${{ version }}.tar.gz
  sha256: 39048cbf7f34cf586e2905b99a05f633fc892753d443181151787725542ee19c


build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - pdm = pdm.core:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - pdm-backend
  run:
    - id >=1.5.0
    - certifi >=2026.10.19
    - python >=${{ python_min }}
    - blinker
    - packaging >22.0
    - platformdirs
    - rich >=12.3.0
    - virtualenv >=20
    - pyproject_hooks
    - unearth >=0.19
    - dep-logic >=0.5
    - findpython >=0.7.0,<1.0.0a0
    - tomlkit >=0.11.1,<1
    - shellingham >=1.3.2
    - python-dotenv >=0.15
    - resolvelib >=1.1
    - python-installer >=1
    - hishel >=1.4.0
    - pbs-installer >=2026.10.25
    - filelock >=3.13
    - truststore >=0.10.4
    - argcomplete >=3.6.3
    - httpx2 >=2.9.1,<3
tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - pdm

about:
  summary: Python Development Master
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pdm/
  repository: https://github.com/pdm-project/pdm

extra:
  recipe-maintainers:
    - xhochy
    - theAeon
    - daylinmorgan
